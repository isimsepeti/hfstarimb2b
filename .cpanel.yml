# cPanel > Git Version Control > "Deploy HEAD Commit" ile site/ klasörünü public_html'e kopyalar.
# Asıl iş scripts/cpanel-deploy.sh içinde (deploy kuyrukta kalırsa Terminal'den de çalışır).
---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/bash scripts/cpanel-deploy.sh
